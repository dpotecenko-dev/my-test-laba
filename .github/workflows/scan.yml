name: Scan
 
# Запускается на каждый push и pull request в main.
# Ничего не деплоит — только проверяет манифесты и YAML.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
 
# Разрешения минимальны: читать код + писать алерты безопасности (для CodeQL).
permissions:
  contents: read
  security-events: write
 
jobs:
  # ---------------------------------------------------------------------------
  # 1. Линт всех YAML-файлов на синтаксис и стиль
  # ---------------------------------------------------------------------------
  yaml-lint:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - name: Run yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          config_file: .yamllint.yml
 
  # ---------------------------------------------------------------------------
  # 2. Валидация Kubernetes-манифестов против схемы API
  #    Ловит опечатки в полях, неверные apiVersion, кривую структуру.
  # ---------------------------------------------------------------------------
  k8s-validate:
    name: Validate k8s manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - name: Install kubeconform
        run: |
          curl -sSL -o kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/
 
      - name: Validate manifests
        run: |
          # -summary  — краткий итог
          # -strict   — запрещает неизвестные поля (ловит опечатки)
          # -ignore-missing-schemas — не падать на CRD без схемы (Ingress-controller и т.п.)
          kubeconform -summary -strict -ignore-missing-schemas \
            -kubernetes-version 1.30.0 \
            k8s/
 
  # ---------------------------------------------------------------------------
  # 3. CodeQL — статический анализ безопасности.
  #    Полезен, когда в репо появится код приложения (не только манифесты).
  # ---------------------------------------------------------------------------
  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          # Подставь языки своего приложения: javascript, python, go, java, ...
          # Если кода пока нет — этот job можно временно убрать.
          languages: javascript
 
      - name: Run analysis
        uses: github/codeql-action/analyze@v3
 
