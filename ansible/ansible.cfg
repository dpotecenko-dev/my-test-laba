[defaults]
# где искать inventory по умолчанию (чтобы не писать -i каждый раз)
inventory = inventory/hosts.ini

# не спрашивать про неизвестные SSH host key при первом подключении
host_key_checking = False

# от какого пользователя подключаться (если у тебя root по SSH)
remote_user = root

# где лежат роли
roles_path = roles

# человекочитаемый вывод вместо одной строки JSON
stdout_callback = yaml

# показывать, сколько выполнялась каждая задача (удобно для отладки)
callbacks_enabled = profile_tasks

# не плодить .retry файлы при ошибках
retry_files_enabled = False

# кешировать факты, чтобы не пересобирать каждый запуск
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts
fact_caching_timeout = 7200

# путь к зашифрованному vault-паролю (опционально, см. ниже)
# vault_password_file = .vault_pass

[privilege_escalation]
# использовать sudo для задач, требующих root
become = True
become_method = sudo
become_user = root
# не спрашивать пароль sudo (если настроен passwordless sudo)
become_ask_pass = False

[ssh_connection]
# ускорение: переиспользовать SSH-соединение между задачами
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
