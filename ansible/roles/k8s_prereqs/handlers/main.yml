---
# =====================================================================
# handlers/main.yml — ОБРАБОТЧИКИ роли k8s_prereqs
# =====================================================================
# Handler — это особая задача, которая выполняется ТОЛЬКО если её
# "разбудил" notify из обычной задачи, И только если та задача реально
# что-то изменила.
#
# Зачем: например, перезапускать containerd нужно лишь когда его конфиг
# поменялся. Если конфиг уже был правильным — перезапуск не нужен.
#
# ВАЖНО: имя handler (после "- name:") должно ТОЧНО совпадать с тем,
# что написано в notify внутри tasks/main.yml.
#
# Ещё нюанс: handlers запускаются НЕ сразу, а в КОНЦЕ playbook'а
# (после всех обычных задач). Это нормально и сделано специально —
# чтобы, например, не перезапускать сервис несколько раз подряд.
# =====================================================================

- name: Применить sysctl
  # Перечитывает все sysctl-конфиги и применяет их к ядру.
  ansible.builtin.command: sysctl --system

- name: Перезапустить containerd
  ansible.builtin.systemd:
    name: containerd
    state: restarted
    enabled: true