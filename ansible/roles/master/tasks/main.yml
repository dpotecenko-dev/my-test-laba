---
- name: Проверить, инициализирован ли кластер
  stat:
    path: /etc/kubernetes/admin.conf
  register: kube_admin

- name: kubeadm init
  command: >
    kubeadm init
    --pod-network-cidr={{ pod_cidr }}
    --apiserver-advertise-address={{ ansible_host }}
  when: not kube_admin.stat.exists

- name: Создать .kube для пользователя
  file:
    path: /home/{{ ansible_user }}/.kube
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"

- name: Скопировать admin.conf пользователю
  copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/{{ ansible_user }}/.kube/config
    remote_src: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"

- name: Установить Flannel (CNI)
  become_user: "{{ ansible_user }}"
  command: kubectl apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
  register: flannel
  changed_when: "'created' in flannel.stdout"

- name: Сгенерировать команду join
  command: kubeadm token create --print-join-command
  register: join_command

- name: Сохранить join-команду для воркеров
  set_fact:
    join_command: "{{ join_command.stdout }}"
