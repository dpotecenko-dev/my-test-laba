# Конфиг yamllint — настроен под Kubernetes-манифесты (не слишком строгий).
extends: default

rules:
  # k8s-манифесты часто длинные — не ругаемся на длину строк
  line-length: disable

  # Разрешаем and on/off/yes/no как строки (важно для truthy-значений)
  truthy:
    allowed-values: ['true', 'false']
    check-keys: false

  # Отступы: 2 пробела, как принято в YAML/k8s
  indentation:
    spaces: 2
    indent-sequences: true

  # Комментарии: минимум 1 пробел после #
  comments:
    min-spaces-from-content: 1

  # Не требуем --- в начале каждого файла
  document-start: disable

ignore: |
.github/:
